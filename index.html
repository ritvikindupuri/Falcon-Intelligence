
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AETHER | COGNITIVE DEFENSE CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              cs: {
                base: '#000000',
                bg: '#0f0f12',
                surface: '#1c1c21',
                border: '#3f3f46',
                red: '#ff2d2d',
                redGlow: 'rgba(255, 45, 45, 0.5)',
                redDark: '#7f1d1d',
                dim: '#a1a1aa',
                subtle: '#52525b'
              }
            },
            animation: {
              'pulse-fast': 'pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scanline': 'scanline 10s linear infinite',
              'float': 'float 3s ease-in-out infinite',
              'core-pulse': 'core-anim 2s ease-in-out infinite',
            },
            keyframes: {
              scanline: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100%)' }
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              'core-anim': {
                '0%, 100%': { opacity: 0.3, transform: 'scale(1)' },
                '50%': { opacity: 1, transform: 'scale(1.1)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0d0d0f;
        color: #f4f4f5;
        overflow: hidden;
      }
      .bg-grid {
        background-image: 
          linear-gradient(to right, rgba(255, 45, 45, 0.1) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 45, 45, 0.1) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
      }
      .glass {
        background: rgba(28, 28, 33, 0.9);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #ff2d2d; }
    </style>
  <script type="importmap">

  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0"
  }
}
</script>

</head>
